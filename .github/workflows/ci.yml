name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - run: gofmt -d cmd internal pkg | tee /tmp/gofmt.diff && test ! -s /tmp/gofmt.diff
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./cmd/relay-edge ./cmd/relay-sim ./cmd/relay-mock

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - run: GOOS=linux GOARCH=${{ matrix.arch }} CGO_ENABLED=0 go build -trimpath -o relay-edge-linux-${{ matrix.arch }} ./cmd/relay-edge
      - uses: actions/upload-artifact@v4
        with:
          name: relay-edge-linux-${{ matrix.arch }}
          path: relay-edge-linux-${{ matrix.arch }}
