apiVersion: apps/v1
kind: Deployment
metadata:
  name: relay-edge
  namespace: relay-edge
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: relay-edge}
  template:
    metadata:
      labels: {app: relay-edge}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: relay-edge
          image: ghcr.io/zyvorai/relay-edge:latest
          args: ["-config", "/etc/relay-edge/config.json"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 500m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: config, mountPath: /etc/relay-edge, readOnly: true}
            - {name: spool, mountPath: /var/lib/relay-edge/spool}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: relay-edge-config}
        - name: spool
          persistentVolumeClaim: {claimName: relay-edge-spool}
        - name: tmp
          emptyDir: {}
